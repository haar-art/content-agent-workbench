<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>自媒体 Agent 工作台</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; margin: 0; padding: 24px; background: #f7f8fa; color: #1f2328; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #6b7280; font-size: 13px; margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: 260px 1fr; gap: 16px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; }
  label { display: block; font-size: 13px; color: #6b7280; margin-bottom: 6px; }
  textarea { width: 100%; height: 80px; font-size: 14px; padding: 8px; border: 1px solid #e5e7eb; border-radius: 6px; font-family: inherit; resize: vertical; }
  .row { margin-bottom: 14px; }
  .chips { display: flex; gap: 8px; }
  .chip { font-size: 13px; padding: 4px 12px; border-radius: 14px; border: 1px solid #e5e7eb; cursor: pointer; }
  .chip.on { background: #e6f1fb; color: #185fa5; border-color: #e6f1fb; }
  button { font-family: inherit; font-size: 14px; padding: 9px 14px; border: 1px solid #e5e7eb; border-radius: 6px; background: #fff; cursor: pointer; }
  button.primary { width: 100%; background: #378add; color: #fff; border-color: #378add; }
  .field { border-top: 1px solid #f0f0f0; padding: 12px 0; }
  .field-head { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .field-name { font-size: 13px; color: #6b7280; }
  .copy { font-size: 12px; color: #378add; cursor: pointer; }
  .field-body { font-size: 14px; margin: 0; line-height: 1.6; white-space: pre-wrap; }
  .meta { font-size: 12px; color: #9ca3af; }
  .hist { font-size: 13px; margin: 6px 0; color: #374151; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hot-item { font-size: 13px; padding: 6px 0; color: #374151; cursor: pointer; border-bottom: 1px solid #f5f5f5; }
  .hot-item:hover { color: #185fa5; }
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .actions button { flex: 1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>自媒体 Agent 工作台</h1>
  <p class="sub">输入一个主题 → 输出可直接拍摄的脚本包</p>
  <div class="grid">

    <div>
      <div class="card">
        <div class="row">
          <label>主题</label>
          <textarea placeholder="例如：一条命令误删了开发者 700GB 数据"></textarea>
          <!-- ★ 三个热点按钮 + 列表容器（新增） -->
          <button onclick="grabHot('aihot')" style="width:100%;margin-top:8px;">抓 AI 热点</button>
          <button onclick="grabHot('news')" style="width:100%;margin-top:6px;">抓我的每日新闻</button>
          <button onclick="grabHot('smart')" style="width:100%;margin-top:6px;">智能选题（AI 帮我筛）</button>
          <div id="hot-list"></div>
        </div>
        <div class="row">
          <label>平台</label>
          <div class="chips">
            <span class="chip on">抖音</span>
            <span class="chip">小红书</span>
          </div>
        </div>
        <button class="primary" onclick="testBtn()">生成脚本包</button>
      </div>

      <div class="card" style="margin-top:16px;">
        <label>历史记录</label>
        <div id="history-list">
          <p class="hist">加载中…</p>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <strong style="font-size:15px;">脚本包</strong>
        <span class="meta">4.2s · 1,860 tokens</span>
      </div>
      <div class="field">
        <div class="field-head"><span class="field-name">标题</span><span class="copy">复制</span></div>
        <p class="field-body" id="f-title">等待生成…</p>
      </div>
      <div class="field">
        <div class="field-head"><span class="field-name">开头钩子</span><span class="copy">复制</span></div>
        <p class="field-body" id="f-hook">等待生成…</p>
      </div>
      <div class="field">
        <div class="field-head"><span class="field-name">正文口播稿</span><span class="copy">复制</span></div>
        <p class="field-body" id="f-script">等待生成…</p>
      </div>
      <div class="field">
        <div class="field-head"><span class="field-name">配图提示词</span><span class="copy">复制</span></div>
        <p class="field-body" id="f-image">等待生成…</p>
      </div>
      <div class="field">
        <div class="field-head"><span class="field-name">话题标签</span><span class="copy">复制</span></div>
        <p class="field-body" id="f-hashtags">等待生成…</p>
      </div>
      <div class="actions">
        <button>一键复制全部</button>
        <button>重新生成</button>
      </div>
    </div>

  </div>
</div>

<script>
  /* ① 生成脚本包（原有） */
  function testBtn() {
    const btn = document.querySelector('.primary');
    btn.textContent = '生成中…（约1分钟）';
    btn.disabled = true;

    const topic = document.querySelector('textarea').value;
    fetch('/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({topic: topic})
    })
      .then(res => res.json())
      .then(data => {
        document.getElementById('f-title').textContent = data.title;
        document.getElementById('f-hook').textContent = data.hook;
        document.getElementById('f-script').textContent = data.script;
        document.getElementById('f-image').textContent = data.image_prompts[0];
        document.getElementById('f-hashtags').textContent = data.hashtags.join(' ');
        btn.textContent = '生成脚本包';
        btn.disabled = false;
      });
  }

  /* ② 热点抓取（新增：支持 aihot / news / smart 三源） */
  function grabHot(source) {
    const box = document.getElementById('hot-list');
    box.innerHTML = '<p class="hist">' + (source === 'smart' ? 'AI 筛选中…（约20秒）' : '抓取中…') + '</p>';
    fetch('/hot?source=' + source)
      .then(res => res.json())
      .then(items => {
        if (!items.length) { box.innerHTML = '<p class="hist">没抓到</p>'; return; }
        box.innerHTML = items.map(it => {
          const t = it.topic || it;
          const r = it.reason ? '<span style="color:#9ca3af;font-size:12px;"> — ' + it.reason + '</span>' : '';
          return '<p class="hot-item" data-t="' + t.replace(/"/g, '&quot;') + '" onclick="pickTopic(this)">· ' + t + r + '</p>';
        }).join('');
      });
  }

  /* ③ 点热点 → 填进主题框（新增） */
  function pickTopic(el) {
    document.querySelector('textarea').value = el.dataset.t || el.textContent.replace(/^·\s*/, '');
    document.getElementById('hot-list').innerHTML = '';
  }

  /* ④ 历史记录（原有） */
  fetch('/history')
    .then(res => res.json())
    .then(items => {
      const box = document.getElementById('history-list');
      if (items.length === 0) {
        box.innerHTML = '<p class="hist">还没有记录</p>';
        return;
      }
      box.innerHTML = items.map(it => '<p class="hist">· ' + it.topic + '</p>').join('');
    });
</script>
</body>
</html>
